
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Driver | Village Ride</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html">VILLAGE RIDE</a>
  <nav><a href="index.html">Home</a><a href="passenger.html">Passenger</a></nav>
</header>
<main class="page">
  <p class="eyebrow">DRIVER PORTAL</p>
  <h1>Drive with Village Ride</h1>

  <section class="panel">
    <h2>Driver registration</h2>
    <form id="signup-form">
      <label>Full name<input name="name" required></label>
      <label>Phone number<input name="phone" required type="tel"></label>
      <label>Email<input name="email" required type="email"></label>
      <label>Password<input name="password" required type="password" minlength="6"></label>
      <label>Vehicle make and model<input name="vehicle" required placeholder="e.g. Suzuki Ertiga"></label>
      <label>Vehicle registration number<input name="registration" required></label>
      <button class="btn yellow">Apply as driver</button>
    </form>
    <p id="auth-message" class="notice"></p>
  </section>

  <section class="panel" style="margin-top:20px">
    <h2>Driver login</h2>
    <form id="login-form">
      <label>Email<input name="email" required type="email"></label>
      <label>Password<input name="password" required type="password"></label>
      <button class="btn">Log in</button>
    </form>
    <div id="driver-panel" class="hidden">
      <p id="driver-name"></p>
      <p id="approval-status" class="notice"></p>
      <button id="online-toggle" class="btn yellow">Go online</button>
      <button id="driver-logout" class="btn">Log out</button>
      <p id="driver-message" class="notice"></p>
      <h2>Available ride requests</h2>
      <div id="available-rides"></div>
      <h2>My active trips</h2>
      <div id="active-rides"></div>
    </div>
  </section>
</main>
<footer><p>Founded by DSR Design · 2026</p></footer>
<script type="module" src="app.js"></script>
</body>
</html>
