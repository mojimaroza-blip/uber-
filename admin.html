
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin | Village Ride</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html">VILLAGE RIDE</a>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="page">
  <p class="eyebrow">ADMINISTRATION</p>
  <h1>Village Ride dashboard</h1>
  <section class="panel">
    <h2>Administrator login</h2>
    <form id="login-form">
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" required></label>
      <button class="btn yellow">Log in</button>
    </form>
    <p id="admin-message" class="notice"></p>
  </section>
  <section id="admin-panel" class="hidden">
    <div class="panel" style="margin-top:20px">
      <h2>Driver applications</h2>
      <div id="driver-applications"></div>
    </div>
    <div class="panel" style="margin-top:20px">
      <h2>All ride requests</h2>
      <div id="all-rides"></div>
    </div>
    <button class="btn" id="admin-logout">Log out</button>
  </section>
</main>
<footer><p>Founded by DSR Design · 2026</p></footer>
<script type="module" src="app.js"></script>
</body>
</html>
